---
version: '3.8'

services:
  ############################
  # RADARR
  ############################
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOST_DATA_PATH}/config/radarr:/config
      - ${HOST_DATA_PATH}:/data
    restart: unless-stopped

  ############################
  # SONARR
  ############################
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOST_DATA_PATH}/config/sonarr:/config
      - ${HOST_DATA_PATH}:/data
    restart: unless-stopped

  ############################
  # PROWLARR
  ############################
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOST_DATA_PATH}/config/prowlarr:/config
    restart: unless-stopped

  ############################
  # BAZARR
  ############################
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOST_DATA_PATH}/config/bazarr:/config
      - ${HOST_DATA_PATH}:/data
    restart: unless-stopped

  ############################
  # LIDARR
  ############################
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOST_DATA_PATH}/config/lidarr:/config
      - ${HOST_DATA_PATH}:/data
    restart: unless-stopped

  ############################
  # QBITTORRENT
  ############################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${HOST_DATA_PATH}/config/qbittorrent:/config
      - ${HOST_DATA_PATH}:/data
    restart: unless-stopped

  ############################
  # GLUETUN
  ############################
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    ports:
      - 8080:8080   # qbittorrent
      - 7878:7878   # radarr
      - 8989:8989   # sonarr
      - 9696:9696   # prowlarr
      - 6767:6767   # bazarr
      - 8686:8686   # lidarr
      - 6881:6881   # qbittorrent torrenting port
      - 6881:6881/udp # qbittorrent torrenting port
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
    restart: unless-stopped