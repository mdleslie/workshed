version: '3.8'

services:
  ############################
  # RADARR
  ############################
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    user: "${PUID}:${PGID}"
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOST_DATA_PATH}/config/radarr:/config
      - ${HOST_DATA_PATH}:/data
    restart: unless-stopped

  ############################
  # SONARR
  ############################
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    user: "${PUID}:${PGID}"
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOST_DATA_PATH}/config/sonarr:/config
      - ${HOST_DATA_PATH}:/data
    restart: unless-stopped

  ############################
  # PROWLARR
  ############################
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    user: "${PUID}:${PGID}"
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOST_DATA_PATH}/config/prowlarr:/config
    restart: unless-stopped

  ############################
  # BAZARR
  ############################
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    user: "${PUID}:${PGID}"
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOST_DATA_PATH}/config/bazarr:/config
      - ${HOST_DATA_PATH}:/data
    restart: unless-stopped

  ############################
  # LIDARR
  ############################
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    user: "${PUID}:${PGID}"
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOST_DATA_PATH}/config/lidarr:/config
      - ${HOST_DATA_PATH}:/data
    restart: unless-stopped

  ############################
  # QBITTORRENT
  ############################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    user: "${PUID}:${PGID}"
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${HOST_DATA_PATH}/config/qbittorrent:/config
      - ${HOST_DATA_PATH}:/data
    restart: unless-stopped

  ############################
  # GLUETUN (VPN)
  ############################
  gluetun:
     image: qmcgaw/gluetun
     container_name: gluetun

     ports:
       - "9696:9696" #prowlarr
       - "7878:7878" #radarr
       - "8989:8989" #sonarr
       - "6767:6767" #bazarr
       - "8686:8686" #lidarr
       - "8080:8080" #qbittorrent
       - "8082:8082" #sabnzbd
       - "6881:6881" #qbittorrent
       - "6881:6881/udp" #qbittorrent
     cap_add:
       - NET_ADMIN
     devices:
       - /dev/net/tun:/dev/net/tun
     environment:
       - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
       - VPN_TYPE=${VPN_TYPE}
       - OPENVPN_USER=${OPENVPN_USER}
       - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
       - SERVER_COUNTRIES=${SERVER_COUNTRIES}
       - FIREWALL_OUTBOUND_SUBNETS=172.17.0.0/16,192.168.1.0/24
     restart: unless-stopped

  ############################
  # QBIT_MANAGE
  ############################
  qbit_manage:
    image: ghcr.io/stuffanthings/qbit_manage:latest
    container_name: qbit_manage
    user: "${PUID}:${PGID}"
    network_mode: "service:gluetun"
    volumes:
      - ${HOST_DATA_PATH}/config/qbit_manage:/config
      - ${HOST_DATA_PATH}:/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - QBT_HOST=127.0.0.1
      - QBT_PORT=8080
      - QBT_USER=david
      - QBT_PASS=Green556
      - QBT_DRY_RUN=true    
    restart: unless-stopped

  ############################
  # SABNZBD
  ############################
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    user: "${PUID}:${PGID}"
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PORT=8082
    volumes:
      - ${HOST_DATA_PATH}/config/sabnzbd:/config
      - ${HOST_DATA_PATH}/qbittorrent/downloads:/downloads
    restart: unless-stopped
    
