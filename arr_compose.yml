version: '3.8'

services:
  ############################
  # RADARR
  ############################
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOST_DATA_PATH}/config/radarr:/config
      - ${HOST_DATA_PATH}:/data # Unified volume for media and downloads
    restart: unless-stopped

  ############################
  # SONARR
  ############################
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOST_DATA_PATH}/config/sonarr:/config
      - ${HOST_DATA_PATH}:/data # Unified volume for media and downloads
    restart: unless-stopped

  ############################
  # PROWLARR
  ############################
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOST_DATA_PATH}/config/prowlarr:/config
    restart: unless-stopped

  ############################
  # BAZARR
  ############################
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOST_DATA_PATH}/config/bazarr:/config
      - ${HOST_DATA_PATH}:/data # Unified volume so it can see media files
    restart: unless-stopped

  ############################
  # LIDARR
  ############################
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOST_DATA_PATH}/config/lidarr:/config
      - ${HOST_DATA_PATH}:/data # Unified volume for media and downloads
    restart: unless-stopped

  ############################
  # QBITTORRENT
  ############################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${HOST_DATA_PATH}/config/qbittorrent:/config
      - ${HOST_DATA_PATH}:/data
    restart: unless-stopped

  ############################
  # GLUETUN (VPN)
  ############################
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    ports:
      - 9696:9696 #prowlarr
      - 7878:7878 #radarr
      - 8989:8989 #sonarr
      - 6767:6767 #bazarr
      - 8686:8686 #lidarr
      - 8080:8080 #qbittorrent
      - 6881:6881 #qbittorrent
      - 6881:6881/udp #qbittorrent
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      # The line below is the fix. It allows containers in the VPN bubble
      # to communicate with other containers on the Docker network.
      - FIREWALL_OUTBOUND_SUBNETS=172.17.0.0/16,192.168.1.0/24
    restart: unless-stopped
  
  ############################
  # QBIT-MANAGE
  ############################
qbit-manage:
  image: ghcr.io/buroa/qbit-manage:latest
  container_name: qbit-manage
  network_mode: "service:gluetun"
  volumes:
    - ${HOST_DATA_PATH}/config/qbit-manage:/config
  environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
  restart: unless-stopped

  ############################
  # CLOUDFLARED
  ############################
cloudflared:
  image: cloudflare/cloudflared:latest
  container_name: cloudflared
  command: proxy-dns
  restart: unless-stopped

  ############################
  # OVERSEER
  ############################
  image: lscr.io/linuxserver/overseerr:latest
  container_name: overseerr
  environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
  volumes:
    - ${HOST_DATA_PATH}/config/overseerr:/config
  ports:
    - "5055:5055"
  restart: unless-stopped

  ############################
  # HOMARR
  ############################
  image: ghcr.io/ajnart/homarr:latest
  container_name: homarr
  volumes:
    - ${HOST_DATA_PATH}/config/homarr/configs:/app/data/configs
    - ${HOST_DATA_PATH}/config/homarr/icons:/app/public/icons
    - /var/run/docker.sock:/var/run/docker.sock:ro
  ports:
    - "7575:7575"
  restart: unless-stopped

  ############################
  # SABNZBD
  ############################
  image: lscr.io/linuxserver/sabnzbd:latest
  container_name: sabnzbd
  network_mode: "service:gluetun" # Keep downloads secure
  environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
  volumes:
    - ${HOST_DATA_PATH}/config/sabnzbd:/config
    - ${HOST_DATA_PATH}/qbittorrent/downloads:/downloads # Share the same downloads folder
  restart: unless-stopped

  ############################
  # UPTIME-KUMA
  ############################
  image: louislam/uptime-kuma:1
  container_name: uptime-kuma
  volumes:
    - ${HOST_DATA_PATH}/config/uptime-kuma:/app/data
  ports:
    - "3001:3001"
  restart: unless-stopped

  ############################
