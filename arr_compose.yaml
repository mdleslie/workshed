---
version: "3.8"

services:
  ############################
  # RADARR - For Movies
  ############################
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Phoenix # Set your timezone
    volumes:
      - /media/arr/config/radarr:/config
      - /media/arr:/data # Unified data volume for media and downloads
    restart: unless-stopped

  ############################
  # SONARR - For TV Shows
  ############################
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Phoenix # Set your timezone
    volumes:
      - /media/arr/config/sonarr:/config
      - /media/arr:/data # Unified data volume
    restart: unless-stopped

  ############################
  # PROWLARR - For Indexers
  ############################
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Phoenix # Set your timezone
    volumes:
      - /media/arr/config/prowlarr:/config
    restart: unless-stopped

  ############################
  # BAZARR - For Subtitles
  ############################
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Phoenix # Set your timezone
    volumes:
      - /media/arr/config/bazarr:/config
      - /media/arr:/data # Unified data volume
    restart: unless-stopped

  ############################
  # LIDARR - For Music
  ############################
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Phoenix # Set your timezone
    volumes:
      - /media/arr/config/lidarr:/config
      - /media/arr:/data # Unified data volume
    restart: unless-stopped

  ############################
  # QBITTORRENT - For Downloads
  ############################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Phoenix # Set your timezone
      - WEBUI_PORT=8080
    volumes:
      - /media/arr/config/qbittorrent:/config
      - /media/arr:/data # Unified data volume
    restart: unless-stopped

  ############################
  # GLUETUN - VPN Client
  ############################
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    ports:
      - 7878:7878 #radarr
      - 8989:8989 #sonarr
      - 9696:9696 #prowlarr
      - 6767:6767 #bazarr
      - 8686:8686 #lidarr
      - 8080:8080 #qbittorrent
      - 6881:6881
      - 6881:6881/udp
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER= # <your vpn user>
      - OPENVPN_PASSWORD= # <your vpn password>
      - SERVER_COUNTRIES=Netherlands
    restart: unless-stopped