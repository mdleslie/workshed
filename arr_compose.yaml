---
version: '3.8'

services:
  ############################
  # RADARR
  ############################
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Phoenix
    volumes:
      - /media/arr/active/radarr/config:/config`
      - /media/arr/Movies:/movies 
      - /media/arr/active/qbittorrent/downloads:/downloads 
    restart: unless-stopped

  ############################
  # SONARR
  ############################
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Phoenix
    volumes:
      - /media/arr/active/sonarr/config:/config
      - /media/arr/Shows:/tv 
      - /media/arr/active/qbittorrent/downloads:/downloads
    restart: unless-stopped

  ############################
  # PROWLARR
  ############################
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Phoenix
    volumes:
      - /media/arr/active/prowlarr/config:/config
    restart: unless-stopped

  ############################
  # BAZARR
  ############################
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Phoenix
    volumes:
      - /media/arr/active/bazarr/config:/config
      - /media/arr/Movies:/movies 
      - /media/arr/active/Shows:/tv
    restart: unless-stopped

  ############################
  # LIDARR
  ############################
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Phoenix
    volumes:
      - /media/arr/active/lidarr/config:/config
      - /media/arr/Music:/music #optional
      - /media/arr/active/qbittorrent/downloads:/downloads #optional
    restart: unless-stopped

  ############################
  # QBITTORRENT
  ############################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Phoenix
      - WEBUI_PORT=8080
    volumes:
      - /media/arr/active/qbittorrent/config:/config
      - /media/arr/active/qbittorrent/downloads:/downloads
       - /media/arr/active/qbittorrent/Monitored:/monitored
    restart: unless-stopped

  ############################
  # GLUETUN
  ############################
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    ports:
      - 9696:9696 #prowlarr
      - 7878:7878 #radarr
      - 8989:8989 #sonarr
      - 6767:6767 #bazarr
      - 8686:8686 #lidarr
      - 8080:8080 #qbittorrent
      - 6881:6881 #qbittorrent
      - 6881:6881/udp #qbittorrent
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn # or wireguard
      - OPENVPN_USER=user
      - OPENVPN_PASSWORD=password
      - SERVER_COUNTRIES=Netherlands
    restart: unless-stopped



